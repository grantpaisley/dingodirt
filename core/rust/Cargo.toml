[workspace]
resolver = "2"
members = [
    "core",
    "geo",
    "ingest",
    "enrich",
    "export",
    "google",
    "daemon",
    "harvest",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Grant"]
license = "MIT"
rust-version = "1.83"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "json",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
figment = { version = "0.10", features = ["env", "toml"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Crypto
sha2 = "0.10"
hex = "0.4"

# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart"] }

# Web framework (daemon)
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs", "compression-gzip"] }

# GPX/FIT parsing
gpx = "0.10"
fitparser = "0.7"

# Geometry
geo = "0.29"
geojson = "0.24"

# OSM extract parsing (roads table for turn cues)
osmpbf = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
