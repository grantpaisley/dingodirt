<!doctype html><html><head><meta charset="utf-8"><title>repro</title>
<style>html,body,#map{height:100%;margin:0}</style></head>
<body><div id="map"></div>
<script>
const link = document.createElement('link'); link.rel = 'stylesheet'; link.href = '/vendor/maplibre-gl.css'; document.head.appendChild(link);
const s = document.createElement('script'); s.src = '/vendor/maplibre-gl.js';
s.onload = async () => {
  const doc = await fetch('/api/packs/OJjvrcN-V3mzw1Doh3j8eYIB/download').then(r => r.json());
  const map = new maplibregl.Map({ container: 'map', style: { version: 8, sources: {}, layers: [] }, center: [138.6, -31.5], zoom: 5 });
  window.__m = map;
  map.on('load', () => {
    map.addSource('tracks', { type: 'geojson', data: { type: 'FeatureCollection', features: doc.tracks.map(t => ({ type: 'Feature', properties: { id: t.id }, geometry: t.geometry })) } });
    map.addLayer({ id: 'tracks', type: 'line', source: 'tracks', paint: { 'line-color': '#e07a3f', 'line-width': 3 } });
  });
};
document.head.appendChild(s);
</script></body></html>
