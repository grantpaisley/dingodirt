# Preset sync — keeps the app repos aligned with this one.
#
# Whenever schemes/ or behaviors/ change on main, run sync-appliers.sh against
# fresh checkouts of DingoNav and Dingo, bump DingoNav's SW cache (offline
# clients only refetch presets on a cache-version change), and land each
# repo's diff as an auto-merged PR (the repos' merge-commit convention, with
# the PR trail preserved). Repos already aligned are skipped.
#
# One-time setup: this needs a fine-grained PAT with Contents: read/write and
# Pull requests: read/write on grantpaisley/DingoNav and grantpaisley/Dingo,
# stored as the SYNC_APPLIERS_TOKEN Actions secret in THIS repo. The job
# fails loudly (not silently) until the secret exists.
name: Sync schema presets to app repos

on:
  push:
    branches: [main]
    paths: ['schemes/**', 'behaviors/**', 'sync-appliers.sh']
  workflow_dispatch:

concurrency:
  group: sync-appliers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SYNC_TOKEN: ${{ secrets.SYNC_APPLIERS_TOKEN }}
    steps:
      - name: Require the cross-repo token
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_APPLIERS_TOKEN secret missing — create a fine-grained PAT (Contents + Pull requests read/write on grantpaisley/DingoNav and grantpaisley/Dingo) and add it to this repo's Actions secrets."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          path: DingoStudio

      - uses: actions/checkout@v4
        with:
          repository: grantpaisley/DingoNav
          token: ${{ secrets.SYNC_APPLIERS_TOKEN }}
          path: DingoNav

      - uses: actions/checkout@v4
        with:
          repository: grantpaisley/Dingo
          token: ${{ secrets.SYNC_APPLIERS_TOKEN }}
          path: Dingo

      - name: Run sync-appliers.sh
        run: bash DingoStudio/sync-appliers.sh "$GITHUB_WORKSPACE"

      - name: Land changed repos as auto-merged PRs
        env:
          GH_TOKEN: ${{ secrets.SYNC_APPLIERS_TOKEN }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          land() { # $1 = repo name (also the checkout dir)
            local repo="$1"
            cd "$GITHUB_WORKSPACE/$repo"
            if ! git status --porcelain | grep -q .; then
              echo "$repo: presets already aligned — nothing to do"
              return
            fi
            if [ "$repo" = DingoNav ]; then
              # presets are SW-precached — offline clients only refetch on a cache bump
              python3 - <<'PY'
          import re
          s = open('sw.js').read()
          s = re.sub(r"dingonav-v(\d+)", lambda m: f"dingonav-v{int(m.group(1)) + 1}", s, count=1)
          open('sw.js', 'w').write(s)
          PY
            fi
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            local branch="sync/schemes-$short"
            git checkout -b "$branch"
            git add -A
            git commit -m "Sync schema presets from DingoStudio@$short"
            git push -u origin "$branch"
            gh pr create --repo "grantpaisley/$repo" --head "$branch" \
              --title "Sync schema presets from DingoStudio@$short" \
              --body "Automated preset sync (schemes/ + behaviors/) from grantpaisley/DingoStudio@$short via the sync-appliers workflow.$([ "$repo" = DingoNav ] && echo ' Includes the SW cache bump so offline clients refetch.')"
            gh pr merge --repo "grantpaisley/$repo" --merge "$branch"
            echo "$repo: synced, PR merged"
          }
          land DingoNav
          land Dingo
